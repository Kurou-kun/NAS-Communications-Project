; NASCP example skin - remote host metrics from Prometheus + node_exporter.
;
; Endpoint    the Prometheus host. Proxy=1 means "HTTPS on 443 by hostname",
;             which is what a reverse proxy (Traefik, nginx) needs; Proxy=0
;             talks plain HTTP on port 9090.
; DeviceLabel which Prometheus label Device= is matched against. Default "job",
;             the only label stock node_exporter always carries. This skin uses
;             "device", which this scrape config sets on every target.
; Device      the value of that label for the machine you want.
; Mount       which filesystem drive_* describes. Default "/" is the root
;             filesystem - on a NAS that is the boot pool, so the TrueNAS block
;             below points at a data pool instead.
; TempChip    chip=~ regex for the hwmon sensor cpu_temp reads. Prometheus
;             regexes are fully anchored, so "coretemp.*" does NOT match a chip
;             named "platform_coretemp_0" - the default allows a prefix.
; PollInterval how often the plugin re-queries Prometheus, in ms (default 2000).
;             Scrapes are typically 15s apart, so polling faster mostly costs
;             requests without gaining freshness.
;
; Several hosts in one skin is fine: each Endpoint+Device pair gets its own
; client, poll thread and value cache.
;
; A value of -1 means "no reading": Prometheus unreachable, an HTTP error, or a
; metric this exporter does not publish. It is deliberately not 0, which would
; be indistinguishable from a genuine zero.

[Rainmeter]
Update=2000
AccurateText=1
DynamicWindowSize=1

[Variables]
Endpoint=prometheus.kurou.dev
Label=device
Fg=235,235,235,255
Dim=235,235,235,150
Accent=120,200,255,255

[mBastionStatus]
Measure=Plugin
Plugin=NASCP
URL=#Endpoint#
Device=bastion
DeviceLabel=#Label#
Type=prometheus
Proxy=1
Data=status
Substitute="1":"up","0":"down","-1":"unreachable"

