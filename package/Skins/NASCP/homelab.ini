; NASCP example skin - remote host metrics from Prometheus + node_exporter.
;
; Endpoint  = the Prometheus host. Proxy=1 means "HTTPS on 443 by hostname",
;             which is what a reverse proxy (Traefik, nginx) needs. Proxy=0
;             resolves the name to IPv4 and talks plain HTTP on port 9090.
;
; Label     = which Prometheus label Device= is matched against. The default is
;             "job", the only label node_exporter always carries. Any other
;             label - "device" here - has to be set by your scrape config.
;
; Device=   = the value of that label for the machine you want.
;
; Several hosts in one skin is fine: each Endpoint+Device pair gets its own
; client, poll thread and value cache. (Before 1.0.2 they shared one cache per
; endpoint and overwrote each other, so one host per skin was the only option.)
;
; Notes on what some metrics mean:
;  - CPU temp reads 0 where node_hwmon_temp_celsius is not exposed - TrueNAS
;    SCALE is one such host.
;  - Disk figures are mountpoint="/" only, so on a NAS that is the boot pool,
;    not the data pools.

[Rainmeter]
Update=2000
AccurateText=1
DynamicWindowSize=1

[Variables]
Endpoint=prometheus.kurou.dev
Label=device
Fg=235,235,235,255
Dim=235,235,235,150
Accent=120,200,255,255


[mBastionStatus]
Measure=Plugin
Plugin=NASCP
URL=#Endpoint#
Device=bastion
DeviceLabel=#Label#
Type=prometheus
Proxy=1
Data=status
Substitute="1":"up","0":"down"

[mBastionUptime]
